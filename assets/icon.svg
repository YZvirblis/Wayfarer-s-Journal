<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!--
    The app emblem: the journal's lozenge-and-rule divider, set on a dark
    leather-toned tile. Original artwork; no game assets.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1712"/>
      <stop offset="1" stop-color="#0d0b09"/>
    </linearGradient>
    <linearGradient id="ruleL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5af5c" stop-opacity="0"/>
      <stop offset="1" stop-color="#d5af5c" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="ruleR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d5af5c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d5af5c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d5af5c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d5af5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="44" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="44" fill="none" stroke="#d5af5c" stroke-opacity="0.35"/>
  <rect x="14" y="14" width="228" height="228" rx="40" fill="none" stroke="#f0e2cb" stroke-opacity="0.06"/>
  <circle cx="128" cy="128" r="84" fill="url(#glow)"/>
  <rect x="34" y="127" width="62" height="2" fill="url(#ruleL)"/>
  <rect x="160" y="127" width="62" height="2" fill="url(#ruleR)"/>
  <g transform="translate(128 128) rotate(45)">
    <rect x="-34" y="-34" width="68" height="68" rx="6" fill="none" stroke="#d5af5c" stroke-width="5"/>
    <rect x="-14" y="-14" width="28" height="28" rx="3" fill="#d5af5c"/>
  </g>
</svg>
